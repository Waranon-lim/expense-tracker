<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Webhook Sequence — Diagram Design</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --rule: rgba(29,29,31,0.12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Geist', sans-serif; }
  .page { max-width: 880px; margin: 0 auto; padding: 48px 32px 32px; }
  .eyebrow {
    font-family: 'Geist Mono', monospace; font-size: 8px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px;
  }
  h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 1.75rem; margin: 0 0 8px; }
  .subtitle { font-size: 14px; color: var(--muted); margin: 0 0 32px; }
  .diagram-wrap { overflow-x: auto; }
  svg { display: block; min-width: 760px; width: 100%; height: auto; }
  footer {
    margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--rule);
    font-family: 'Geist Mono', monospace; font-size: 8px; color: var(--muted); letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">Sequence — Apple skin</p>
  <h1>Expense Auto-Categorization Flow</h1>
  <p class="subtitle">A transaction webhook saves the expense instantly, then a push prompt collects the category before it's forgotten.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 800 624" role="img" aria-labelledby="expense-seq-title expense-seq-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="expense-seq-title">Expense auto-categorization sequence</title>
    <desc id="expense-seq-desc">Sequence diagram showing a bank transaction webhook triggering an immediate pending save, a push notification prompting the user to pick a category, a timeout fallback that keeps it uncategorized, and the final confirmed save.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#6e6e73"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0071e3"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0066cc"/>
      </marker>
      <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#6e6e73" stroke-width="1.2"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f7"/>

    <!-- lifelines -->
    <line x1="80" y1="80" x2="80" y2="560" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="240" y1="80" x2="240" y2="560" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="400" y1="80" x2="400" y2="560" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="560" y1="80" x2="560" y2="560" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="720" y1="80" x2="720" y2="560" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- alt fragment frame (drawn before activation bars/messages, behind them) -->
    <rect x="200" y="284" width="560" height="148" rx="4" fill="rgba(29,29,31,0.02)" stroke="rgba(29,29,31,0.22)" stroke-width="1"/>
    <rect x="200" y="284" width="40" height="16" rx="2" fill="#f5f5f7" stroke="rgba(29,29,31,0.22)" stroke-width="1"/>
    <text x="220" y="296" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
    <text x="212" y="316" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[user responds &#8804; 30s]</text>
    <line x1="208" y1="356" x2="752" y2="356" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="212" y="372" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else: timeout]</text>

    <!-- activation bars -->
    <rect x="236" y="120" width="8" height="416" fill="rgba(29,29,31,0.06)" stroke="#6e6e73" stroke-width="0.8"/>
    <rect x="396" y="152" width="8" height="40" fill="rgba(29,29,31,0.06)" stroke="#6e6e73" stroke-width="0.8"/>
    <rect x="396" y="464" width="8" height="40" fill="rgba(29,29,31,0.06)" stroke="#6e6e73" stroke-width="0.8"/>
    <rect x="556" y="216" width="8" height="40" fill="rgba(29,29,31,0.06)" stroke="#6e6e73" stroke-width="0.8"/>
    <rect x="716" y="248" width="8" height="100" fill="rgba(29,29,31,0.06)" stroke="#6e6e73" stroke-width="0.8"/>

    <!-- m1: Payment -> API : POST /webhook (call, link-blue) -->
    <line x1="80" y1="120" x2="236" y2="120" stroke="#0066cc" stroke-width="1" marker-end="url(#arrow-link)"/>
    <rect x="128" y="100" width="76" height="12" rx="2" fill="#f5f5f7"/>
    <text x="166" y="109" fill="#0066cc" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POST /webhook</text>

    <!-- m2: API -> DB : INSERT pending -->
    <line x1="244" y1="152" x2="396" y2="152" stroke="#6e6e73" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="272" y="132" width="88" height="12" rx="2" fill="#f5f5f7"/>
    <text x="316" y="141" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">INSERT pending</text>

    <!-- m3: DB --> API : 200 OK (return, dashed) -->
    <line x1="396" y1="184" x2="244" y2="184" stroke="#6e6e73" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="286" y="164" width="52" height="12" rx="2" fill="#f5f5f7"/>
    <text x="312" y="173" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200 OK</text>

    <!-- m4: API -> Push : send prompt (async, open) -->
    <line x1="244" y1="216" x2="556" y2="216" stroke="#6e6e73" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
    <rect x="358" y="196" width="84" height="12" rx="2" fill="#f5f5f7"/>
    <text x="400" y="205" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">send prompt</text>

    <!-- m5: Push -> User : push notification (async, open) -->
    <line x1="564" y1="248" x2="716" y2="248" stroke="#6e6e73" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
    <rect x="580" y="228" width="120" height="12" rx="2" fill="#f5f5f7"/>
    <text x="640" y="237" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">push: $42 at Store X</text>

    <!-- m6 (alt region 1): User -> API : tap category -->
    <line x1="716" y1="340" x2="244" y2="340" stroke="#6e6e73" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="440" y="320" width="76" height="12" rx="2" fill="#f5f5f7"/>
    <text x="478" y="329" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tap: Food</text>

    <!-- m7 (alt region 2): API self-message : default uncategorized -->
    <path d="M240,396 H272 Q280,396 280,404 V412 Q280,420 272,420 H240"
          fill="none" stroke="#6e6e73" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="288" y="402" width="132" height="12" rx="2" fill="#f5f5f7"/>
    <text x="354" y="411" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">default: Uncategorized</text>

    <!-- m8: API -> DB : UPDATE category -->
    <line x1="244" y1="464" x2="396" y2="464" stroke="#6e6e73" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="264" y="444" width="112" height="12" rx="2" fill="#f5f5f7"/>
    <text x="320" y="453" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">UPDATE category</text>

    <!-- m9: DB --> API : 200 OK -->
    <line x1="396" y1="496" x2="244" y2="496" stroke="#6e6e73" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="286" y="476" width="52" height="12" rx="2" fill="#f5f5f7"/>
    <text x="312" y="485" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200 OK</text>

    <!-- m10: API --> User : Saved (headline success, accent) -->
    <line x1="244" y1="528" x2="716" y2="528" stroke="#0071e3" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="452" y="508" width="56" height="12" rx="2" fill="#f5f5f7"/>
    <text x="480" y="517" fill="#0071e3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Saved &#10003;</text>

    <!-- actor boxes (drawn last so they sit cleanly atop lifeline starts) -->
    <rect x="20" y="40" width="120" height="40" rx="6" fill="#f5f5f7"/>
    <rect x="20" y="40" width="120" height="40" rx="6" fill="rgba(29,29,31,0.03)" stroke="rgba(29,29,31,0.30)" stroke-width="1"/>
    <text x="80" y="65" fill="#1d1d1f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Payment API</text>

    <rect x="180" y="40" width="120" height="40" rx="6" fill="#f5f5f7"/>
    <rect x="180" y="40" width="120" height="40" rx="6" fill="rgba(0,113,227,0.08)" stroke="#0071e3" stroke-width="1.2"/>
    <text x="240" y="65" fill="#1d1d1f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Expense API</text>

    <rect x="340" y="40" width="120" height="40" rx="6" fill="#f5f5f7"/>
    <rect x="340" y="40" width="120" height="40" rx="6" fill="rgba(29,29,31,0.05)" stroke="#6e6e73" stroke-width="1"/>
    <text x="400" y="65" fill="#1d1d1f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Database</text>

    <rect x="500" y="40" width="120" height="40" rx="6" fill="#f5f5f7"/>
    <rect x="500" y="40" width="120" height="40" rx="6" fill="rgba(29,29,31,0.03)" stroke="rgba(29,29,31,0.30)" stroke-width="1"/>
    <text x="560" y="65" fill="#1d1d1f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Push Service</text>

    <rect x="660" y="40" width="120" height="40" rx="6" fill="#f5f5f7"/>
    <rect x="660" y="40" width="120" height="40" rx="6" fill="rgba(110,110,115,0.10)" stroke="#86868b" stroke-width="1"/>
    <text x="720" y="65" fill="#1d1d1f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>

    <!-- legend -->
    <line x1="40" y1="584" x2="760" y2="584" stroke="rgba(29,29,31,0.12)" stroke-width="0.8"/>
    <text x="40" y="600" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="596" x2="164" y2="596" stroke="#6e6e73" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="172" y="600" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace">Call</text>
    <line x1="260" y1="596" x2="284" y2="596" stroke="#6e6e73" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="292" y="600" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace">Return</text>
    <line x1="400" y1="596" x2="424" y2="596" stroke="#6e6e73" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
    <text x="432" y="600" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace">Async / push</text>
    <line x1="560" y1="596" x2="584" y2="596" stroke="#0071e3" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="592" y="600" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace">Headline success</text>
  </svg>
  </div>

  <footer>Diagram Design — Apple skin — expense-webhook-sequence — 2026-09-05</footer>
</div>
</body>
</html>
