<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Webhook Architecture — Diagram Design</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --rule: rgba(29,29,31,0.12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Geist', sans-serif; }
  .page { max-width: 1040px; margin: 0 auto; padding: 48px 32px 32px; }
  .eyebrow {
    font-family: 'Geist Mono', monospace; font-size: 8px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px;
  }
  h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 1.75rem; margin: 0 0 8px; }
  .subtitle { font-size: 14px; color: var(--muted); margin: 0 0 32px; }
  .diagram-wrap { overflow-x: auto; }
  svg { display: block; min-width: 900px; width: 100%; height: auto; }
  footer {
    margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--rule);
    font-family: 'Geist Mono', monospace; font-size: 8px; color: var(--muted); letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">Architecture — Apple skin</p>
  <h1>Expense Webhook Architecture</h1>
  <p class="subtitle">A webhook (not a socket) delivers the transaction; a push notification (not a socket) delivers the category prompt.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 1000 280" role="img" aria-labelledby="expense-arch-title expense-arch-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="expense-arch-title">Expense webhook architecture</title>
    <desc id="expense-arch-desc">Architecture diagram showing a payment provider sending a transaction webhook to an expense tracker backend, which saves it and pushes a category prompt through a push notification service to the user's phone, with the manual app-open path shown as an optional bypassed branch.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#6e6e73"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0071e3"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0066cc"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f7"/>

    <!-- C1: Payment API -> Backend (straight, WEBHOOK, link) -->
    <line x1="200" y1="72" x2="280" y2="72" stroke="#0066cc" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="216" y="52" width="48" height="12" rx="2" fill="#f5f5f7"/>
    <text x="240" y="61" fill="#0066cc" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WEBHOOK</text>

    <!-- C2: Backend -> Push Service (straight, PROMPT) -->
    <line x1="480" y1="72" x2="560" y2="72" stroke="#6e6e73" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="498" y="52" width="44" height="12" rx="2" fill="#f5f5f7"/>
    <text x="520" y="61" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT</text>

    <!-- C3: Backend -> Database (straight vertical, SAVE) -->
    <line x1="348" y1="104" x2="348" y2="160" stroke="#6e6e73" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="362" y="126" width="36" height="12" rx="2" fill="#f5f5f7"/>
    <text x="380" y="135" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE</text>

    <!-- C4: Push Service -> User's Phone (straight, NOTIFY, dashed = best-effort push) -->
    <line x1="720" y1="72" x2="800" y2="72" stroke="#6e6e73" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="738" y="52" width="44" height="12" rx="2" fill="#f5f5f7"/>
    <text x="760" y="61" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOTIFY</text>

    <!-- C6: User's Phone -> Tracker App (dashed, bridged over C5 crossing) -->
    <path d="M852,104 V124 a8,8 0 0,0 0,16 V160"
          fill="none" stroke="#86868b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="866" y="108" width="44" height="12" rx="2" fill="#f5f5f7"/>
    <text x="888" y="117" fill="#86868b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPTIONAL</text>

    <!-- C5: User's Phone -> Backend (category return, routed clear of the crossing) -->
    <path d="M908,104 V124 Q908,132 900,132 H420 Q412,132 412,124 V104"
          fill="none" stroke="#6e6e73" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="632" y="112" width="56" height="12" rx="2" fill="#f5f5f7"/>
    <text x="660" y="121" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CATEGORY</text>

    <!-- Payment API (external) -->
    <rect x="40" y="40" width="160" height="64" rx="6" fill="#f5f5f7"/>
    <rect x="40" y="40" width="160" height="64" rx="6" fill="rgba(29,29,31,0.03)" stroke="rgba(29,29,31,0.30)" stroke-width="1"/>
    <rect x="48" y="46" width="64" height="12" rx="2" fill="transparent" stroke="rgba(29,29,31,0.40)" stroke-width="0.8"/>
    <text x="80" y="55" fill="rgba(29,29,31,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
    <text x="120" y="76" fill="#1d1d1f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Payment API</text>
    <text x="120" y="92" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Bank / card</text>

    <!-- Expense Tracker Backend (focal) -->
    <rect x="280" y="40" width="200" height="64" rx="6" fill="#f5f5f7"/>
    <rect x="280" y="40" width="200" height="64" rx="6" fill="rgba(0,113,227,0.08)" stroke="#0071e3" stroke-width="1.2"/>
    <rect x="288" y="46" width="64" height="12" rx="2" fill="transparent" stroke="rgba(0,113,227,0.40)" stroke-width="0.8"/>
    <text x="320" y="55" fill="rgba(0,113,227,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
    <text x="380" y="76" fill="#1d1d1f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Expense Tracker</text>
    <text x="380" y="92" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">API + webhook</text>

    <!-- Push Service (external) -->
    <rect x="560" y="40" width="160" height="64" rx="6" fill="#f5f5f7"/>
    <rect x="560" y="40" width="160" height="64" rx="6" fill="rgba(29,29,31,0.03)" stroke="rgba(29,29,31,0.30)" stroke-width="1"/>
    <rect x="568" y="46" width="64" height="12" rx="2" fill="transparent" stroke="rgba(29,29,31,0.40)" stroke-width="0.8"/>
    <text x="600" y="55" fill="rgba(29,29,31,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
    <text x="640" y="76" fill="#1d1d1f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Push Service</text>
    <text x="640" y="92" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">APNs / FCM</text>

    <!-- User's Phone (input/device) -->
    <rect x="800" y="40" width="160" height="64" rx="6" fill="#f5f5f7"/>
    <rect x="800" y="40" width="160" height="64" rx="6" fill="rgba(110,110,115,0.10)" stroke="#86868b" stroke-width="1"/>
    <rect x="808" y="46" width="64" height="12" rx="2" fill="transparent" stroke="rgba(134,134,139,0.40)" stroke-width="0.8"/>
    <text x="840" y="55" fill="rgba(134,134,139,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEVICE</text>
    <text x="880" y="76" fill="#1d1d1f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User's Phone</text>
    <text x="880" y="92" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Quick reply</text>

    <!-- Database (store) -->
    <rect x="320" y="160" width="120" height="64" rx="6" fill="#f5f5f7"/>
    <rect x="320" y="160" width="120" height="64" rx="6" fill="rgba(29,29,31,0.05)" stroke="#6e6e73" stroke-width="1"/>
    <rect x="328" y="166" width="64" height="12" rx="2" fill="transparent" stroke="rgba(110,110,115,0.40)" stroke-width="0.8"/>
    <text x="360" y="175" fill="rgba(110,110,115,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
    <text x="380" y="196" fill="#1d1d1f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Database</text>
    <text x="380" y="212" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">transactions</text>

    <!-- Expense Tracker App (optional, dashed) -->
    <rect x="800" y="160" width="160" height="64" rx="6" fill="#f5f5f7"/>
    <rect x="800" y="160" width="160" height="64" rx="6" fill="rgba(29,29,31,0.02)" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="808" y="166" width="64" height="12" rx="2" fill="transparent" stroke="rgba(29,29,31,0.30)" stroke-width="0.8"/>
    <text x="840" y="175" fill="rgba(29,29,31,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPTIONAL</text>
    <text x="880" y="196" fill="#1d1d1f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tracker App</text>
    <text x="880" y="212" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">manual (skipped)</text>

    <!-- legend -->
    <line x1="40" y1="248" x2="960" y2="248" stroke="rgba(29,29,31,0.12)" stroke-width="0.8"/>
    <text x="40" y="264" fill="#6e6e73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="160" y="256" width="12" height="12" rx="2" fill="rgba(29,29,31,0.03)" stroke="rgba(29,29,31,0.30)" stroke-width="1"/>
    <text x="178" y="265" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace">External</text>

    <rect x="330" y="256" width="12" height="12" rx="2" fill="rgba(0,113,227,0.08)" stroke="#0071e3" stroke-width="1.2"/>
    <text x="348" y="265" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace">Core service</text>

    <rect x="500" y="256" width="12" height="12" rx="2" fill="rgba(110,110,115,0.10)" stroke="#86868b" stroke-width="1"/>
    <text x="518" y="265" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace">Device</text>

    <rect x="670" y="256" width="12" height="12" rx="2" fill="rgba(29,29,31,0.05)" stroke="#6e6e73" stroke-width="1"/>
    <text x="688" y="265" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace">Store</text>

    <rect x="840" y="256" width="12" height="12" rx="2" fill="rgba(29,29,31,0.02)" stroke="rgba(29,29,31,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="858" y="265" fill="#6e6e73" font-size="9" font-family="'Geist Mono', monospace">Optional (bypassed)</text>
  </svg>
  </div>

  <footer>Diagram Design — Apple skin — expense-webhook-architecture — 2026-09-05</footer>
</div>
</body>
</html>
